{% extends "base.html" %}
{% block title %}Ingresar{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card"><div class="card-body">
  <h1 class="h4 mb-3">Iniciar sesión</h1>
  <form method="post" novalidate>{% csrf_token %}
    {% include "partials/_form.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary w-100" type="submit">Ingresar</button>
  </form>
  <div class="mt-3 small"><a href="{% url 'accounts:password_reset' %}">¿Olvidaste tu contraseña?</a> ·
    <a href="{% url 'accounts:registro' %}">Crear cuenta</a></div>
</div></div></div></div>
{% endblock %}
