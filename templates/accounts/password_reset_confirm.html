{% extends "base.html" %}
{% block title %}Nueva contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card"><div class="card-body">
{% if validlink %}
  <h1 class="h4">Nueva contraseña</h1>
  <form method="post" novalidate>{% csrf_token %}{% include "partials/_form.html" %}
    <button class="btn btn-primary" type="submit">Guardar</button></form>
{% else %}
  <h1 class="h4">Enlace inválido</h1><p>El enlace venció o ya fue usado. <a href="{% url 'accounts:password_reset' %}">Solicitar otro</a></p>
{% endif %}
</div></div></div></div>
{% endblock %}
