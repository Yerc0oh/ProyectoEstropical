{% extends "base.html" %}
{% block title %}Cambiar contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6"><div class="card"><div class="card-body">
  <h1 class="h4">Cambiar contraseña</h1>
  <p class="text-muted">Introduce tu contraseña actual y la nueva. Tu sesión se mantendrá iniciada.</p>
  <form method="post" novalidate>{% csrf_token %}
    {% include "partials/_form.html" %}
    <button class="btn btn-primary" type="submit">Cambiar contraseña</button>
    <a class="btn btn-link" href="{% url 'accounts:perfil' %}">Cancelar</a>
  </form>
</div></div></div></div>
{% endblock %}
